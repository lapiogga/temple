<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="응선사">
  <!--
    파비콘(법륜). src/app/icon.svg 에 두면 Next 가 link rel="icon" 을 자동으로 넣는다.

    components/Icons.js 의 DharmaWheel 을 그대로 쓰지 않은 이유가 둘이다.

    1) 그쪽은 색을 CSS 변수(brand)로 쓴다. 화면 안에서는 풀리지만 이 파일은 단독으로
       불려 CSS 문맥이 없다. 그래서 리터럴 #9e3b2f 를 쓴다 — brand 토큰이 가리키는
       seok-80 의 실제 값이다. 팔레트를 바꾸면 여기도 같이 고쳐야 한다.
       디자인 토큰 규율의 예외이고, 그 이유가 이 주석이다.

    2) 획이 너무 가늘다. 원본은 48 좌표계에서 1.1~1.7 인데 탭 아이콘은 16px 로 그려지므로
       0.4px 안팎이 되어 사라진다. 안쪽 보조 원을 빼고 획을 3 으로 올려 16px 에서도
       바퀴로 읽히게 했다. 살은 8개 그대로다.

    주석 안에 연이은 붙임표를 쓰지 말 것. XML 주석은 그것을 허용하지 않아 SVG 전체가
    파싱 오류로 깨진다(2026-07-31 에 실제로 겪었다 — 토큰 이름을 그대로 적었다가).
  -->
  <g fill="none" stroke="#9e3b2f" stroke-width="3" stroke-linecap="round">
    <circle cx="24" cy="24" r="18" />
    <circle cx="24" cy="24" r="5.5" />
    <line x1="24" y1="6" x2="24" y2="18.5" />
    <line x1="24" y1="29.5" x2="24" y2="42" />
    <line x1="6" y1="24" x2="18.5" y2="24" />
    <line x1="29.5" y1="24" x2="42" y2="24" />
    <line x1="11.3" y1="11.3" x2="20.1" y2="20.1" />
    <line x1="27.9" y1="27.9" x2="36.7" y2="36.7" />
    <line x1="36.7" y1="11.3" x2="27.9" y2="20.1" />
    <line x1="20.1" y1="27.9" x2="11.3" y2="36.7" />
  </g>
</svg>
