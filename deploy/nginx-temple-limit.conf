# /etc/nginx/conf.d/temple-limit.conf
#
# limit_req_zone 과 map 은 http 컨텍스트에 있어야 한다. sites-available 의 파일은
# server 블록이라 여기에 따로 둔다. conf.d/*.conf 는 nginx.conf 의 http{} 안에서
# include 되므로 이 파일이 그 자리를 맡는다.

# 인증 시도(POST)만 센다.
#
# 예전에는 키가 $binary_remote_addr 하나라 메서드를 가리지 않았다. 그래서 운영자가
# 로그인 화면을 열기만 해도 카운트가 올라갔다 — 실측(2026-07-31) 결과 GET 7번째부터
# 503 이 났다(rate 5r/m + burst 5 라 6개까지 통과). 비밀번호를 한 번도 넣지 않았는데
# 잠기는 셈이라, 무차별 대입을 막는 게 아니라 정상 사용자를 막고 있었다.
# 화면을 새로고침하거나 뒤로 갔다 오기만 해도 걸린다.
#
# nginx 는 키가 빈 문자열이면 그 요청에 제한을 적용하지 않는다. 이 성질을 이용해
# GET·HEAD 등에는 빈 키를 주어 아예 세지 않게 하고, POST 에만 IP 를 키로 준다.
# 로그인 화면은 얼마든지 열 수 있고, 비밀번호를 넣는 시도만 분당 5회로 묶인다.
map $request_method $temple_login_key {
    POST    $binary_remote_addr;
    default "";
}

# 관리자 로그인(/login). 쓰는 사람이 두엇이라 좁게 잡는다.
limit_req_zone $temple_login_key zone=temple_login:10m rate=5r/m;

# 회원 인증 경로(/member-login · /member-login/reset · /join · /find-account).
# 관리자와 zone 을 나눈 이유는 뒤에 있는 사람 수가 다르기 때문이다. 신도 여러 명이
# 한 공유기(NAT) 뒤에서 같은 공인 IP 로 보일 수 있어, 관리자와 같은 분당 5회로 묶으면
# 법회 안내 직후처럼 여럿이 몰릴 때 정상 가입이 서로를 막는다.
#
# 키는 위 map 을 그대로 쓴다 — 여기서도 POST 만 센다. 가입 화면을 열어 보는 것,
# 아이디 찾기 화면을 여닫는 것은 시도가 아니다.
limit_req_zone $temple_login_key zone=temple_member:10m rate=10r/m;
