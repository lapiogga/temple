# /etc/nginx/sites-available/temple  (심볼릭 링크로 sites-enabled 에 연결)
# 초안(테스트) 단계: 자체서명(self-signed) HTTPS. 차주 도메인 확보 시 certbot 으로 교체.
#
# [필수 선행] limit_req_zone 은 http 컨텍스트에 있어야 한다.
#   → /etc/nginx/conf.d/temple-limit.conf 로 저장(또는 nginx.conf 의 http{} 안):
#       limit_req_zone $binary_remote_addr zone=temple_login:10m rate=5r/m;
#
# [자체서명 인증서 생성(테스트용)]
#   sudo openssl req -x509 -nodes -days 90 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/temple-selfsigned.key \
#     -out    /etc/ssl/certs/temple-selfsigned.crt -subj "/CN=temple-draft"

server {
    listen 80;
    server_name _;
    # 초안: HTTP → HTTPS 강제. (certbot 도입 시 acme-challenge 는 예외 처리)
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;   # 차주 도메인 확보 시 실제 도메인으로 교체

    ssl_certificate     /etc/ssl/certs/temple-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/temple-selfsigned.key;

    # 로그인 무차별 대입 방지(분당 5회, 순간 버스트 5). 방화벽 개방보다 먼저 적용.
    location = /login {
        limit_req zone=temple_login burst=5 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 정적 자산 캐시
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
