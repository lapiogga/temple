# /etc/nginx/sites-available/temple  (심볼릭 링크로 sites-enabled 에 연결)
# 초안(테스트) 단계: 자체서명(self-signed) HTTPS. 차주 도메인 확보 시 certbot 으로 교체.
#
# [필수 선행] limit_req_zone·map 은 http 컨텍스트에 있어야 한다.
#   → deploy/nginx-temple-limit.conf 를 /etc/nginx/conf.d/temple-limit.conf 로 복사.
#     예전에는 그 내용을 여기 주석으로만 적어 뒀는데, 주석은 복사할 때 빠뜨리기 쉽고
#     고쳐도 저장소 이력에 안 남는다. 파일로 뺐다.
#
# [자체서명 인증서 생성(테스트용)]
#   sudo openssl req -x509 -nodes -days 90 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/temple-selfsigned.key \
#     -out    /etc/ssl/certs/temple-selfsigned.crt -subj "/CN=temple-draft"

server {
    listen 80;
    server_name _;
    # 초안: HTTP → HTTPS 강제. (certbot 도입 시 acme-challenge 는 예외 처리)
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;   # nginx 1.24(Ubuntu 24.04) 호환: 별도 `http2 on;` 미지원
    server_name _;   # 차주 도메인 확보 시 실제 도메인으로 교체

    ssl_certificate     /etc/ssl/certs/temple-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/temple-selfsigned.key;

    # 업로드 본문 상한.
    #
    # 이 줄이 없으면 nginx 기본값 1m 이 걸린다. 그러면 앱이 약속한 한도(이미지 8MB ·
    # 첨부 20MB, src/lib/upload.js)는 도달조차 못 하고 1MB 에서 잘린다.
    # 실측(2026-07-31): 2MB 본문이 nginx 경유 413, 같은 것을 :3000 직접으로는 통과.
    # dev(:3001)는 nginx 를 안 거치므로 개발 중에는 이 벽이 보이지 않는다 —
    # 실제로 2.87MB PNG 가 dev 에서는 정상 저장돼 있었다.
    #
    # 값을 앱 한도보다 넉넉히 잡는 이유: 자르는 주체가 앱이어야 한다.
    # nginx 가 먼저 자르면 사용자는 어느 파일이 왜 걸렸는지 없는 맨 413 HTML 을 본다.
    # 앱이 자르면 "이미지는 8MB 이하만 가능합니다" 처럼 파일명과 사유가 나온다.
    #
    # 한 요청 최대치(앱이 스스로 허용하는 값):
    #   · 갤러리 일괄  8MB × 15장 = 120MB  (admin/gallery/actions.js MAX_BATCH)
    #   · 히어로       8MB × 10장 =  80MB  (admin/site/actions.js HERO_MAX_IMAGES)
    #   · 회원 첨부    20MB × 1개          (upload.js ATTACH_MAX_BYTES)
    # 가장 큰 120MB 에 multipart 경계·캡션 여유를 더해 128m.
    #
    # 남은 과제: 이 값은 서버 전체에 걸리므로 비인증 요청도 128MB 를 디스크로 스풀할 수
    # 있다. 좁히려면 일괄 업로드가 있는 관리자 경로만 따로 올려야 하는데, location 을
    # 새로 만들면 proxy_set_header 를 복제해야 하고 이 변경은 nginx reload 없이
    # 검증할 수 없다. 로드맵 §3-A 4(nginx 하드닝)에서 rate limit 과 함께 다룰 것.
    # MAX_BATCH 를 줄이면 이 값도 같이 내려갈 수 있다.
    client_max_body_size 128m;

    # 로그인 무차별 대입 방지(분당 5회, 순간 버스트 5). 방화벽 개방보다 먼저 적용.
    #
    # 세는 대상은 POST 뿐이다. 키를 메서드에 따라 가르는 map 이 temple-limit.conf 에
    # 있다 — 화면을 여는 GET 은 세지 않는다(그러지 않으면 새로고침만으로 잠긴다).
    location = /login {
        limit_req zone=temple_login burst=5 nodelay;
        # 기본값 503 은 "서버가 죽었다" 로 읽혀 운영자가 장애로 오인한다.
        # 429 Too Many Requests 가 실제 상황을 말한다.
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 업로드 이미지 — nginx 가 디스크에서 직접 서빙한다(Node 우회).
    #
    # Next 14 는 프로덕션에서 public/ 의 파일 목록을 **기동 시 1회만** 스캔해 캐시한다
    # (next/dist/server/lib/router-utils/filesystem.js). 그래서 서비스 기동 이후에
    # 추가된 파일은 재시작 전까지 404 가 된다. 실제로 2026-07-29 시점 prod 에서
    # 산신도·입구사진·안내도가 전부 404 였다(기동 14:51:40 < 파일 생성 14:56:22).
    #
    # 관리자가 올린 이미지가 재시작 전까지 보이지 않는다는 뜻이라 운영상 치명적이다.
    # 이 경로만 nginx 가 직접 처리하면 재시작 없이 즉시 반영된다.
    # 부수 효과로 이미지 트래픽이 Node 이벤트루프를 타지 않고 캐시 헤더도 붙는다.
    location /uploads/ {
        root /var/www/temple/public;   # alias 가 아니라 root — URI 의 /uploads/ 가 실제 디렉터리명과 같다
        access_log off;
        expires 30d;
        try_files $uri =404;           # 없는 파일을 Node 로 넘기지 않는다
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 정적 자산 캐시
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
